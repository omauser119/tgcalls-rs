[workspace]
members = ["crates/tgcalls-core", "crates/tgcalls-sandbox", "crates/tgcalls-py", "crates/tgcalls-isolation", "crates/tgcalls-ffi"]
resolver = "2"
exclude = ["vendor/webrtc", "vendor/rtc-mdns", "crates/tgcalls-wasm"]

[patch.crates-io]
webrtc = { path = "vendor/webrtc" }
rtc-mdns = { path = "vendor/rtc-mdns" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.52", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "process", "macros"] }
webrtc = "=0.21.1"
rtc = "=0.21.1"
rusty-opus = { git = "https://github.com/remade-with-rust/rusty-opus", rev = "782bd611d05b266c72338b74fd3631ae7afe563b" }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "unwind"
overflow-checks = true
lto = "thin"

# The interpreter executes cryptographic protocol timers during functional tests.
# Compile it with optimization in debug builds as well; no JIT is enabled.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3
