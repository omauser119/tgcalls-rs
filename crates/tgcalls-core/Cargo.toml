[package]
name = "tgcalls-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true, optional = true }
bytes.workspace = true
futures = { workspace = true, optional = true }
rtc.workspace = true
rusty-opus.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true }
webrtc = { workspace = true, optional = true }
aes = "0.8"
ctr = "0.9"
crypto-bigint = { version = "=0.7.11", default-features = false, features = ["zeroize"] }
getrandom = "0.3"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
rusty_h264 = { git = "https://github.com/Remade-With-Rust/rusty_h264", rev = "67bd819fbc618f926fa529bc7dacd3caaba5a13a", default-features = false, features = ["std", "asm"] }
nnnoiseless = { version = "=0.5.2", default-features = false }
sonora = "=0.3.0"
rff-core = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs", rev = "8523f574f7b3dc86e26673988d434a73ef8e699a" }
rff-format = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs", rev = "8523f574f7b3dc86e26673988d434a73ef8e699a" }
rff-format-ogg = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs", rev = "8523f574f7b3dc86e26673988d434a73ef8e699a" }

[features]
default = ["async"]
async = ["dep:async-trait", "dep:futures", "dep:tokio", "dep:webrtc"]

[dev-dependencies]
env_logger = "0.11"

[lints]
workspace = true
